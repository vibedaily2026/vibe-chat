
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#25334a;font-family:Arial,"Tahoma",sans-serif}
header{background:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7edf5;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:800;color:#3978c9}
.logo span{color:#263b59;font-weight:400}
button{border:0;border-radius:10px;padding:11px 17px;background:#4b86d6;color:white;font-size:14px;cursor:pointer}
button:hover{opacity:.88}
button.secondary{background:#e9f1fc;color:#376caf}
button.danger{background:#fce9e9;color:#b44444}
main{max-width:950px;margin:25px auto;padding:0 15px}
.card{background:white;border:1px solid #e8edf4;border-radius:17px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #304c7010}
h2{margin-top:0;color:#304b70}
input,textarea{width:100%;padding:13px;border:1px solid #dce4ef;border-radius:10px;font-size:15px;margin:7px 0 15px;background:#fbfcfe}
textarea{min-height:90px;resize:vertical}
label{font-size:14px;font-weight:bold;color:#52657f}
.hidden{display:none!important}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tabs button{flex:1}
.tabs button.active{background:#294d7b}
#messages{height:390px;overflow-y:auto;background:#f7f9fc;border-radius:12px;padding:15px;margin:15px 0}
.msg{background:white;border:1px solid #e8edf4;border-radius:12px;padding:10px 13px;margin-bottom:10px;overflow-wrap:anywhere}
.msg small{display:block;color:#8795a8;font-size:11px;margin-bottom:5px}
.msg p{margin:0;white-space:pre-wrap}
.row{display:flex;gap:8px}
.row input{margin:0}
.row button{white-space:nowrap}
.avatar{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#eaf1fb;border:3px solid #e3edf9}
#authBox{max-width:430px;margin:55px auto}
.notice{padding:12px;border-radius:10px;background:#edf5ff;color:#376caf;margin:12px 0;font-size:14px}
.muted{color:#8290a3;font-size:13px}
@media(max-width:600px){
 header{padding:13px 15px}
 main{margin:15px auto}
 .card{padding:17px}
 #messages{height:55vh}
 .row{gap:5px}
 .row button{padding:10px}
}
</style>
</head>
<body>

<header>
  <div class="logo">Vibe <span>Chat</span></div>
  <div id="userArea" class="hidden">
    <span id="userEmail" class="muted"></span>
    <button class="secondary" onclick="logout()">ออกจากระบบ</button>
  </div>
</header>

<div id="authBox" class="card">
  <h2 id="authTitle">เข้าสู่ Vibe Chat</h2>
  <p class="muted">พื้นที่พูดคุยและพบเพื่อนใหม่</p>
  <label>อีเมล</label>
  <input id="email" type="email" placeholder="กรอกอีเมล">
  <label>รหัสผ่าน</label>
  <input id="password" type="password" placeholder="กรอกรหัสผ่าน">
  <button id="authButton" style="width:100%" onclick="login()">เข้าสู่ระบบ</button>
  <p id="authMessage" class="notice hidden"></p>
  <p class="muted" style="text-align:center;margin-top:20px">
    ยังไม่มีบัญชี? <a href="#" onclick="toggleAuth();return false">สมัครสมาชิก</a>
  </p>
</div>

<main id="app" class="hidden">
  <div class="tabs">
    <button id="chatTab" class="active" onclick="showPage('chat')">แชท</button>
    <button id="profileTab" class="secondary" onclick="showPage('profile')">โปรไฟล์ของฉัน</button>
  </div>

  <section id="chatPage" class="card">
    <h2>ห้องแชท Vibe</h2>
    <p class="muted">พูดคุยกับสมาชิกคนอื่น ๆ ได้ที่นี่</p>
    <div id="messages"></div>
    <div class="row">
      <input id="messageInput" placeholder="พิมพ์ข้อความ..." maxlength="2000"
        onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">ส่ง</button>
    </div>
    <p id="chatStatus" class="muted"></p>
  </section>

  <section id="profilePage" class="card hidden">
    <h2>โปรไฟล์ของฉัน</h2>
    <p class="muted">ข้อมูลนี้ช่วยให้สมาชิกคนอื่นรู้จักคุณมากขึ้น</p>

    <div style="display:flex;align-items:center;gap:17px;margin:20px 0">
      <img id="avatarPreview" class="avatar" alt="รูปโปรไฟล์">
      <div>
        <strong id="profileEmail"></strong>
        <p class="muted">สมาชิก Vibe Chat</p>
      </div>
    </div>

    <label>ชื่อผู้ใช้ (Username)</label>
    <input id="username" placeholder="เช่น vibe_user">

    <label>ชื่อที่แสดง</label>
    <input id="displayName" placeholder="ชื่อที่อยากให้คนอื่นเห็น">

    <label>ลิงก์รูปโปรไฟล์</label>
    <input id="avatarUrl" type="url" placeholder="https://example.com/photo.jpg">

    <label>แนะนำตัว</label>
    <textarea id="bio" maxlength="300" placeholder="เล่าเกี่ยวกับตัวคุณสักนิด..."></textarea>

    <label>ความสนใจ</label>
    <input id="interests" placeholder="เช่น เพลง, หนัง, ท่องเที่ยว, เกม">
    <p class="muted">คั่นแต่ละความสนใจด้วยเครื่องหมายจุลภาค (,)</p>

    <button onclick="saveProfile()">บันทึกโปรไฟล์</button>
    <p id="profileStatus" class="notice hidden"></p>
  </section>
</main>

<script>
const SUPABASE_URL = "https://epdbfncrfjyrgqwjyctu.supabase.co";
const SUPABASE_KEY = "sb_publishable_CEFu0MBeJ9d5Jci-xc0ggg_uMaI82dG";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let realtimeChannel = null;
let isSignup = false;

function el(id){ return document.getElementById(id); }

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function showAuthMessage(message){
  el("authMessage").textContent = message;
  el("authMessage").classList.remove("hidden");
}

function toggleAuth(){
  isSignup = !isSignup;
  el("authTitle").textContent = isSignup ? "สมัครสมาชิก Vibe Chat" : "เข้าสู่ Vibe Chat";
  el("authButton").textContent = isSignup ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
  el("authButton").onclick = isSignup ? signup : login;
  el("authMessage").classList.add("hidden");
}

async function login(){
  const email = el("email").value.trim();
  const password = el("password").value;
  if(!email || !password) return showAuthMessage("กรุณากรอกอีเมลและรหัสผ่าน");

  el("authButton").disabled = true;
  const {data,error} = await db.auth.signInWithPassword({email,password});
  el("authButton").disabled = false;

  if(error) return showAuthMessage("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
  await startApp(data.user);
}

async function signup(){
  const email = el("email").value.trim();
  const password = el("password").value;
  if(!email || !password) return showAuthMessage("กรุณากรอกอีเมลและรหัสผ่าน");
  if(password.length < 6) return showAuthMessage("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");

  el("authButton").disabled = true;
  const {data,error} = await db.auth.signUp({
    email,password,
    options:{emailRedirectTo:location.origin}
  });
  el("authButton").disabled = false;

  if(error) return showAuthMessage("สมัครสมาชิกไม่สำเร็จ: " + error.message);

  if(data.session){
    await startApp(data.user);
  }else{
    showAuthMessage("สมัครสมาชิกสำเร็จแล้ว กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี จากนั้นกลับมาเข้าสู่ระบบ");
  }
}

async function startApp(user){
  currentUser = user;
  el("authBox").classList.add("hidden");
  el("app").classList.remove("hidden");
  el("userArea").classList.remove("hidden");
  el("userEmail").textContent = user.email || "";

  await loadOrCreateProfile();
  await loadMessages();
  subscribeMessages();
}

async function loadOrCreateProfile(){
  el("profileEmail").textContent = currentUser.email || "";

  const {data,error} = await db
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
    alert("โหลดโปรไฟล์ไม่สำเร็จ: " + error.message);
    return;
  }

  if(data){
    currentProfile = data;
  }else{
    const fallbackName = (currentUser.email || "สมาชิก").split("@")[0];
    const newProfile = {
      id:currentUser.id,
      username:"user_" + currentUser.id.replace(/-/g,"").slice(0,8),
      display_name:fallbackName,
      bio:"",
      avatar_url:"",
      interests:[]
    };

    const {data:created,error:createError} = await db
      .from("profiles")
      .insert(newProfile)
      .select()
      .single();

    if(createError){
      console.error(createError);
      alert("สร้างโปรไฟล์ไม่สำเร็จ: " + createError.message);
      return;
    }
    currentProfile = created;
  }

  el("username").value = currentProfile.username || "";
  el("displayName").value = currentProfile.display_name || "";
  el("avatarUrl").value = currentProfile.avatar_url || "";
  el("bio").value = currentProfile.bio || "";
  el("interests").value = (currentProfile.interests || []).join(", ");
  updateAvatarPreview();
}

function updateAvatarPreview(){
  const url = el("avatarUrl").value.trim();
  el("avatarPreview").src = url || "https://ui-avatars.com/api/?name=Vibe+User&background=eaf1fb&color=426b9f";
}
el("avatarUrl").addEventListener("input",updateAvatarPreview);

async function saveProfile(){
  if(!currentUser) return;

  const username = el("username").value.trim().toLowerCase();
  const displayName = el("displayName").value.trim();
  const avatarUrl = el("avatarUrl").value.trim();
  const bio = el("bio").value.trim();
  const interests = el("interests").value
    .split(",").map(x=>x.trim()).filter(Boolean).slice(0,20);

  if(!/^[a-z0-9_]{3,24}$/.test(username)){
    return profileMessage("Username ต้องมี 3–24 ตัว ใช้ได้เฉพาะ a-z, 0-9 และ _");
  }
  if(!displayName) return profileMessage("กรุณากรอกชื่อที่แสดง");
  if(avatarUrl && !/^https?:\/\//i.test(avatarUrl)){
    return profileMessage("ลิงก์รูปโปรไฟล์ต้องขึ้นต้นด้วย http:// หรือ https://");
  }

  const {data,error} = await db
    .from("profiles")
    .update({
      username,
      display_name:displayName,
      avatar_url:avatarUrl || null,
      bio,
      interests
    })
    .eq("id",currentUser.id)
    .select()
    .single();

  if(error){
    if(error.code === "23505"){
      return profileMessage("Username นี้มีคนใช้แล้ว กรุณาเลือกชื่ออื่น");
    }
    return profileMessage("บันทึกไม่สำเร็จ: " + error.message);
  }

  currentProfile = data;
  updateAvatarPreview();
  profileMessage("บันทึกโปรไฟล์เรียบร้อยแล้ว");
}

function profileMessage(message){
  el("profileStatus").textContent = message;
  el("profileStatus").classList.remove("hidden");
}

function showPage(page){
  el("chatPage").classList.toggle("hidden",page !== "chat");
  el("profilePage").classList.toggle("hidden",page !== "profile");
  el("chatTab").classList.toggle("active",page === "chat");
  el("profileTab").classList.toggle("active",page === "profile");
  el("chatTab").classList.toggle("secondary",page !== "chat");
  el("profileTab").classList.toggle("secondary",page !== "profile");
}

async function loadMessages(){
  const {data,error} = await db
    .from("messages")
    .select("id,created_at,message,user_id")
    .order("created_at",{ascending:true})
    .limit(100);

  if(error){
    el("chatStatus").textContent = "โหลดข้อความไม่สำเร็จ: " + error.message;
    return;
  }

  el("messages").innerHTML = "";
  (data || []).forEach(addMessage);
  scrollMessages();
}

function addMessage(message){
  if(document.querySelector('[data-message-id="'+CSS.escape(String(message.id))+'"]')) return;

  const item = document.createElement("div");
  item.className = "msg";
  item.dataset.messageId = message.id;

  const isMe = message.user_id === currentUser?.id;
  const sender = isMe ? "คุณ" : "สมาชิก";
  const time = message.created_at ? new Date(message.created_at).toLocaleString("th-TH") : "";

  item.innerHTML = `<small>${sender} · ${safe(time)}</small><p>${safe(message.message)}</p>`;
  el("messages").appendChild(item);
}

function scrollMessages(){
  el("messages").scrollTop = el("messages").scrollHeight;
}

async function sendMessage(){
  const input = el("messageInput");
  const message = input.value.trim();
  if(!message || !currentUser) return;

  input.disabled = true;
  const {error} = await db.from("messages").insert({
    message,
    user_id:currentUser.id
  });
  input.disabled = false;

  if(error){
    el("chatStatus").textContent = "ส่งข้อความไม่สำเร็จ: " + error.message;
  }else{
    input.value = "";
    el("chatStatus").textContent = "";
  }
  input.focus();
}

function subscribeMessages(){
  if(realtimeChannel) db.removeChannel(realtimeChannel);

  realtimeChannel = db.channel("vibe-chat-messages")
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"messages"
    },payload=>{
      addMessage(payload.new);
      scrollMessages();
    })
    .subscribe();
}

async function logout(){
  if(realtimeChannel) await db.removeChannel(realtimeChannel);
  await db.auth.signOut();
  currentUser = null;
  currentProfile = null;
  el("app").classList.add("hidden");
  el("userArea").classList.add("hidden");
  el("authBox").classList.remove("hidden");
  el("messages").innerHTML = "";
}

async function init(){
  const {data:{session}} = await db.auth.getSession();
  if(session?.user) await startApp(session.user);
}

db.auth.onAuthStateChange((event,session)=>{
  if(event === "SIGNED_OUT"){
    currentUser = null;
  }
});

el("authButton").onclick = login;
init();
</script>
</body>
</html>
